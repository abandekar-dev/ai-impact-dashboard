[project]
name = "ai-impact-dashboard"
version = "0.1.0"
description = "Predictive dashboard for modeling enterprise AI business impact"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52.1",
    "numpy>=2.2.6",
    "openai>=1.82.1",
    "pandas>=2.2.3",
    "plotly>=6.1.2",
    "scikit-learn>=1.6.1",
    "sqlalchemy>=2.0.41",
    "streamlit>=1.45.1",
    "trafilatura>=2.0.0",
]

[project.optional-dependencies]
# Only needed when DATABASE_URL points at PostgreSQL. The app falls back to
# SQLite without it, and psycopg2-binary has no wheels for newer Python
# versions, so keeping it out of the default set lets hosts build cleanly.
postgres = ["psycopg2-binary>=2.9.10"]
