[project]
name = "ai-impact-dashboard"
version = "0.1.0"
description = "Simulate the business impact of AI across enterprise functions"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.6",
    "openai>=1.82.1",
    "pandas>=2.2.3",
    "plotly>=6.1.2",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.0",
    "sqlalchemy>=2.0.41",
    "streamlit>=1.45.1",
]

[project.optional-dependencies]
# Only needed when DATABASE_URL points at PostgreSQL. The app falls back to
# SQLite without it, and psycopg2-binary has no wheels for newer Python
# versions, so keeping it out of the default set lets hosts build cleanly.
postgres = ["psycopg2-binary>=2.9.10"]
